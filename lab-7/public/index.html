<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Playlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Playlist</h1>

  <input type="text" id="search" placeholder="Пошук за виконавцем">
  <button id="btn-search">Search</button>

  <ul id="song-list"></ul>

  <h2>Add song</h2>
  <form id="song-form">
    <input type="text" name="title" placeholder="title song" required>
    <input type="text" name="artist" placeholder="artist" required>
    <button type="submit">Add</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
