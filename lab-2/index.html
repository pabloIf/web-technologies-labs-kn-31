<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Pokémon API — Салтиков Павло</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        text-align: center;
        margin: 0;
        padding: 20px;
      }

      h1 {
        color: #161616;
      }

      button {
        background-color: #d3b634;
        color: white;
        border: none;
        padding: 8px 15px;
        cursor: pointer;
        border-radius: 4px;
      }

      button:hover {
        background-color: #d3b634;
      }

      #output {
        margin-top: 20px;
      }

      .pokemon-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
      }

      .pokemon-card {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px;
        width: 120px;
      }

      .pokemon-card img {
        width: 80px;
        height: 80px;
      }
    </style>
  </head>

  <body>
    <h1>Pokemon API — Салтиков Павло</h1>
    <button id="refresh">Update data</button>
    <div id="output"></div>

    <script src="script.js"></script>
  </body>
</html>
